# T007 — ruff + pytest on pull requests and on merges to main, not on every push.
# The invariant suite is part of pytest and is never skipped; I-27 (the Skill
# matches the tool registry) fails the build on drift.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check src/jarvis
      - run: python -m pytest src/jarvis/tests -q
      # The committed web UI must be the one the source builds.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix dashboard
      - run: npm run build:jarvis --prefix dashboard
      - run: git diff --exit-code -- src/jarvis/web/static || (echo "src/jarvis/web/static is stale; run npm run build:jarvis --prefix dashboard" && exit 1)
