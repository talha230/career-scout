[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-scout"
version = "0.2.0"
description = "Local-first job and scholarship agent with an MCP control surface for Claude Code and OpenAI Codex"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Muhammad Talha Yaqoob" }]
keywords = ["jobs", "scholarships", "mcp", "local-first", "gmail"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    # Core
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
    "python-dateutil>=2.9",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
    # Web
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    # MCP
    "mcp>=2.0",
    # Documents
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    # Google — only the one-time consent flow. Every API call goes through
    # career_scout.net (I-08), so google-api-python-client and its httplib2 transport
    # are deliberately not dependencies.
    "google-auth-oauthlib>=1.2",
    # Crypto
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
ocr = ["pytesseract>=0.3.10", "pillow>=10.3"]

[project.scripts]
career-scout = "career_scout.cli:app"

[project.urls]
Homepage = "https://github.com/talha230/career-scout"

[tool.hatch.build.targets.wheel]
packages = ["src/career_scout"]

[tool.pytest.ini_options]
testpaths = ["src/career_scout/tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "invariant: a never-skipped safety invariant; the suite fails if one is skipped",
    "network: requires real network access; excluded by default",
]
filterwarnings = ["error::DeprecationWarning:career-scout.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "RET", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/career_scout/tests/*" = ["S", "B011"]

[tool.coverage.run]
source = ["src/career_scout"]
